<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>designtok — Design Token Converter</title>
  <meta name="description" content="Convert design tokens to CSS custom properties, Tailwind CSS config, or SASS variables — all in your browser, zero dependencies.">
  <meta property="og:title" content="designtok — Design Token Converter">
  <meta property="og:description" content="Convert design tokens to CSS, Tailwind, or SASS instantly.">
  <meta property="og:image" content="https://kvnlnk.github.io/designtok/og-image.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0d1117">

<style>
/* ============================================================
   Custom Properties (Design Tokens for the app itself)
   ============================================================ */
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-tertiary: #e8eaed;
  --bg-card: #ffffff;
  --text-primary: #1f2328;
  --text-secondary: #656d76;
  --text-muted: #8b949e;
  --border-color: #d0d7de;
  --border-focus: #58a6ff;
  --accent: #0969da;
  --accent-hover: #0550ae;
  --accent-glow: rgba(9, 105, 218, 0.15);
  --error: #cf222e;
  --error-bg: #ffebe9;
  --success: #1a7f37;
  --success-bg: #dafbe1;
  --code-bg: #f6f8fa;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;
  --transition: 180ms ease;
}

[data-theme="dark"] {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --bg-card: #161b22;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --border-color: #30363d;
  --border-focus: #58a6ff;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --accent-glow: rgba(88, 166, 255, 0.15);
  --error: #f85149;
  --error-bg: rgba(248, 81, 73, 0.1);
  --success: #3fb950;
  --success-bg: rgba(63, 185, 80, 0.1);
  --code-bg: #0d1117;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}

/* ============================================================
   Layout
   ============================================================ */
.app-container {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}

/* ============================================================
   Header
   ============================================================ */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
}

.header-brand {
  display: flex;
  flex-direction: column;
}

.app-title {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.app-title span {
  color: var(--accent);
}

.tagline {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.theme-toggle {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: background var(--transition), border-color var(--transition), transform var(--transition);
  flex-shrink: 0;
}

.theme-toggle:hover {
  background: var(--border-color);
  transform: scale(1.05);
}

.theme-toggle:active {
  transform: scale(0.95);
}

/* ============================================================
   Card
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
}

.card:focus-within {
  box-shadow: var(--shadow-md), 0 0 0 1px var(--border-focus);
  border-color: var(--border-focus);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 0.8125rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-secondary);
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 0.875rem;
  font-weight: 500;
  font-family: inherit;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
  white-space: nowrap;
  user-select: none;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-primary:active {
  transform: scale(0.97);
}

.btn-secondary {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-color: var(--border-color);
}

.btn-secondary:hover {
  background: var(--border-color);
}

.btn-secondary:active {
  transform: scale(0.97);
}

.btn-success {
  background: var(--success);
  color: #ffffff;
  border-color: var(--success);
}

.btn-success:active {
  transform: scale(0.97);
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8125rem;
}

/* ============================================================
   Textarea
   ============================================================ */
.textarea-wrapper {
  position: relative;
}

textarea {
  width: 100%;
  min-height: 200px;
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.55;
  color: var(--text-primary);
  background: var(--code-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  resize: vertical;
  outline: none;
  transition: border-color var(--transition), background var(--transition);
  tab-size: 2;
}

textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

textarea::placeholder {
  color: var(--text-muted);
}

textarea[readonly] {
  cursor: default;
  background: var(--bg-secondary);
}

textarea.has-error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(248, 81, 73, 0.15);
}

/* ============================================================
   Validation Error
   ============================================================ */
.error-message {
  display: none;
  margin-top: 8px;
  padding: 8px 12px;
  font-size: 0.8125rem;
  color: var(--error);
  background: var(--error-bg);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(248, 81, 73, 0.2);
  word-break: break-word;
}

.error-message.visible {
  display: block;
}

/* ============================================================
   Format Selector (Radio Buttons)
   ============================================================ */
.format-selector {
  display: flex;
  gap: 4px;
  background: var(--bg-tertiary);
  padding: 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.format-option {
  position: relative;
}

.format-option input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}

.format-option label {
  display: block;
  padding: 7px 16px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-secondary);
  background: transparent;
  border-radius: calc(var(--radius-sm) - 1px);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}

.format-option input:checked + label {
  color: var(--text-primary);
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
}

.format-option label:hover {
  color: var(--text-primary);
}

.format-option input:focus-visible + label {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

/* ============================================================
   Copy Button
   ============================================================ */
.copy-container {
  display: flex;
  align-items: center;
  gap: 8px;
}

.copy-feedback {
  font-size: 0.8125rem;
  color: var(--success);
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
  order: -1;
}

.copy-feedback.visible {
  opacity: 1;
}

/* ============================================================
   Toolbar
   ============================================================ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 640px) {
  .app-container {
    padding: 16px 12px 32px;
  }

  .app-title {
    font-size: 1.4rem;
  }

  .card {
    padding: 14px;
  }

  textarea {
    min-height: 150px;
    font-size: 0.8125rem;
    padding: 10px 12px;
  }

  .format-selector {
    width: 100%;
  }

  .format-option {
    flex: 1;
  }

  .format-option label {
    text-align: center;
    padding: 7px 8px;
    font-size: 0.75rem;
  }

  .card-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .copy-container {
    width: 100%;
    flex-wrap: wrap;
  }

  .copy-container .format-selector {
    flex: 1;
    min-width: 0;
  }

  .copy-container .btn {
    flex-shrink: 0;
  }
}

@media (min-width: 641px) and (max-width: 1024px) {
  .app-container {
    padding: 24px 24px 48px;
  }
}

@media (min-width: 1025px) {
  .app-container {
    padding: 32px 24px 64px;
  }
}

/* ============================================================
   Utilities
   ============================================================ */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ============================================================
   Scrollbar (dark theme)
   ============================================================ */
[data-theme="dark"] textarea::-webkit-scrollbar {
  width: 8px;
}

[data-theme="dark"] textarea::-webkit-scrollbar-track {
  background: var(--bg-primary);
  border-radius: 4px;
}

[data-theme="dark"] textarea::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 4px;
}

[data-theme="dark"] textarea::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* ============================================================
   Footer
   ============================================================ */
.app-footer {
  margin-top: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.app-footer a {
  color: var(--accent);
  text-decoration: none;
}

.app-footer a:hover {
  text-decoration: underline;
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.error-message.visible {
  animation: fadeIn 200ms ease forwards;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- ====== Header ====== -->
  <header class="app-header">
    <div class="header-brand">
      <h1 class="app-title">design<span>tok</span></h1>
      <p class="tagline">Convert design tokens to CSS, Tailwind, or SASS</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <!-- ====== Input Section ====== -->
  <section class="card" id="inputCard">
    <div class="card-header">
      <span class="card-title">Input — JSON Design Tokens</span>
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" id="sampleBtn" title="Load sample tokens">📋 Sample</button>
      </div>
    </div>
    <div class="textarea-wrapper">
      <textarea id="inputArea"
        placeholder='{\n  &quot;colors&quot;: {\n    &quot;primary&quot;: &quot;#3b82f6&quot;,\n    &quot;secondary&quot;: &quot;#8b5cf6&quot;\n  },\n  &quot;spacing&quot;: {\n    &quot;md&quot;: &quot;1rem&quot;\n  }\n}'
        spellcheck="false"
      ></textarea>
    </div>

  <!-- ====== Output Section ====== -->
  <section class="card" id="outputCard">
    <div class="card-header">
      <span class="card-title">Output</span>

        <span class="copy-feedback" id="copyFeedback">Copied!</span>
        <div class="format-selector" role="radiogroup" aria-label="Output format">
          <div class="format-option">
            <input type="radio" name="format" id="fmtCss" value="css" checked>
            <label for="fmtCss">CSS</label>

            <input type="radio" name="format" id="fmtTailwind" value="tailwind">

    <div class="textarea-wrapper">
      <textarea id="outputArea" readonly placeholder="Output will appear here…" spellcheck="false"></textarea>
    </div>
  </section>

  <!-- ====== Footer ====== -->
  <footer class="app-footer">
    <p>designtok &mdash; <a href="https://github.com/kvnlnk/designtok" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </footer>
</div>

<script>
/* ============================================================
   designtok — Vanilla JS App
   Zero dependencies, works offline, single-file.
   ============================================================ */
(function() {
  'use strict';

  // ---- DOM refs ----
  const inputArea    = document.getElementById('inputArea');
  const outputArea   = document.getElementById('outputArea');
  const errorMsg     = document.getElementById('errorMsg');
  const sampleBtn    = document.getElementById('sampleBtn');
  const copyBtn      = document.getElementById('copyBtn');
  const copyFeedback = document.getElementById('copyFeedback');
  const themeToggle  = document.getElementById('themeToggle');
  const themeIcon    = document.getElementById('themeIcon');
  const formatRadios = document.querySelectorAll('input[name="format"]');

  // ---- Sample design tokens ----
  var SAMPLE_TOKENS = {
    "colors": {
      "primary": "#3b82f6",
      "primary-dark": "#2563eb",
      "secondary": "#8b5cf6",
      "secondary-dark": "#7c3aed",
      "accent": "#f59e0b",
      "neutral": {
        "50": "#f9fafb",
        "100": "#f3f4f6",
        "200": "#e5e7eb",
        "300": "#d1d5db",
        "400": "#9ca3af",
        "500": "#6b7280",
        "600": "#4b5563",
        "700": "#374151",
        "800": "#1f2937",
        "900": "#111827"
      },
      "success": "#10b981",
      "warning": "#f59e0b",
      "error": "#ef4444",
      "info": "#3b82f6"
    },
    "spacing": {
      "xs": "0.25rem",
      "sm": "0.5rem",
      "md": "1rem",
      "lg": "1.5rem",
      "xl": "2rem",
      "2xl": "3rem",
      "3xl": "4rem"
    },
    "typography": {
      "fontFamily": {
        "sans": "Inter, system-ui, -apple-system, sans-serif",
        "serif": "Merriweather, Georgia, serif",
        "mono": "JetBrains Mono, 'Fira Code', monospace"
      },
      "fontSize": {
        "xs": "0.75rem",
        "sm": "0.875rem",
        "base": "1rem",
        "lg": "1.125rem",
        "xl": "1.25rem",
        "2xl": "1.5rem",
        "3xl": "1.875rem",
        "4xl": "2.25rem"
      },
      "fontWeight": {
        "normal": "400",
        "medium": "500",
        "semibold": "600",
        "bold": "700"
      },
      "lineHeight": {
        "tight": "1.25",
        "normal": "1.5",
        "relaxed": "1.75"
      }
    },
    "shadows": {
      "sm": "0 1px 2px 0 rgba(0, 0, 0, 0.05)",
      "md": "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)",
      "lg": "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1)",
      "xl": "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)",
      "inner": "inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)"
    },
    "borderRadius": {
      "none": "0",
      "sm": "0.125rem",
      "md": "0.375rem",
      "lg": "0.5rem",
      "xl": "0.75rem",
      "2xl": "1rem",
      "full": "9999px"
    },
    "breakpoints": {
      "sm": "640px",
      "md": "768px",
      "lg": "1024px",
      "xl": "1280px",
      "2xl": "1536px"
    }
  };

  // ---- Theme state ----
  var currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';

  // ---- Helpers ----

  /** Debounce a function call */
  function debounce(fn, ms) {
    var timer;
    return function() {
      var ctx = this;
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function() { fn.apply(ctx, args); }, ms);
    };
  }

  /**
   * Flatten a nested object into dot-notation key-value pairs.
   * { colors: { primary: "#06f" } } → { "colors.primary": "#06f" }
   */
  function flatten(obj, prefix) {
    var result = {};
    for (var key in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
      var prefixed = prefix ? prefix + '.' + key : key;
      var val = obj[key];
      if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
        var sub = flatten(val, prefixed);
        for (var sk in sub) {
          if (Object.prototype.hasOwnProperty.call(sub, sk)) {
            result[sk] = sub[sk];
          }
        }
      } else {
        result[prefixed] = String(val);
      }
    }
    return result;
  }

  /**
   * Build a nested object from dot-notation keys.
   * { "colors.primary": "#06f" } → { colors: { primary: "#06f" } }
   */
  function unflatten(flat) {
    var root = {};
    for (var key in flat) {
      if (!Object.prototype.hasOwnProperty.call(flat, key)) continue;
      var value = flat[key];
      var parts = key.split('.');
      var current = root;
      for (var i = 0; i < parts.length - 1; i++) {
        var part = parts[i];
        if (!current[part] || typeof current[part] !== 'object') {
          current[part] = {};
        }
        current = current[part];
      }
      current[parts[parts.length - 1]] = value;
    }
    return root;
  }

  /**
   * Replace dots with hyphens and lowercase for use as CSS/SASS identifiers.
   */
  function normalizeKey(key) {
    return key.replace(/\./g, '-').toLowerCase();
  }

  // ---- Parse input JSON ----
  function parseInput(jsonStr) {
    var parsed = JSON.parse(jsonStr);
    if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
      throw new Error('Input must be a JSON object (key-value pairs).');
    }
    return parsed;
  }

  /** Format JSON error with line number hint */
  function formatJsonError(err, jsonStr) {
    var msg = err.message || 'Invalid JSON';
    if (err instanceof SyntaxError) {
      var m = msg.match(/position\s+(\d+)/i);
      if (m) {
        var pos = parseInt(m[1], 10);
        var line = (jsonStr.slice(0, pos).match(/\n/g) || []).length + 1;
        return 'JSON parse error at line ' + line + ': ' + msg;
      }
    }
    return 'Error: ' + msg;
  }

  // ================================================================
  // CONVERTERS
  // ================================================================

  // ---- 1. CSS Custom Properties ----
  //   :root {
  //     --colors-primary: #3b82f6;
  //     --colors-primary-dark: #2563eb;
  //   }
  function convertToCss(flat) {
    var lines = [':root {'];
    var keys = Object.keys(flat).sort();
    for (var i = 0; i < keys.length; i++) {
      lines.push('  --' + normalizeKey(keys[i]) + ': ' + flat[keys[i]] + ';');
    }
    lines.push('}');
    return lines.join('\n') + '\n';
  }

  // ---- 2. Tailwind CSS Config ----
  //   module.exports = {
  //     theme: {
  //       extend: {
  //         colors: { primary: '#3b82f6', ... },
  //         spacing: { md: '1rem', ... }
  //       }
  //     }
  //   };
  function convertToTailwind(flat) {
    // Rebuild nested structure from flattened dot-notation keys.
    // For Tailwind, dots mean nesting, hyphens stay as hyphens in leaf keys.
    var nested = unflatten(flat);

    // Add a trailing comma after the last item in an object
    var INDENT = '  ';

    function renderValue(val, depth) {
      if (val === null) return 'null';
      if (typeof val === 'boolean') return val ? 'true' : 'false';
      if (typeof val === 'number') return String(val);

      // String — wrap in single quotes
      if (typeof val === 'string') {
        // Escape single quotes inside the string
        return "'" + val.replace(/'/g, "\\'") + "'";
      }

      // Object — render recursively
      var keys = Object.keys(val);
      if (keys.length === 0) return '{}';

      var pad = INDENT.repeat(depth);
      var innerPad = INDENT.repeat(depth + 1);
      var parts = ['{'];
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var v = val[k];
        // Quote key if it contains characters unsafe for JS identifiers
        var formattedKey = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : "'" + k.replace(/'/g, "\\'") + "'";
        parts.push(innerPad + formattedKey + ': ' + renderValue(v, depth + 1) + ',');
      }
      parts.push(pad + '}');
      return parts.join('\n');
    }

    var body = renderValue(nested, 1);
    // Indent the body to sit under "extend:"
    var indentedBody = body.split('\n').map(function(line) {
      return INDENT + line;
    }).join('\n');

    return 'module.exports = {\n' +
           INDENT + 'theme: {\n' +
           INDENT + INDENT + 'extend: ' + indentedBody.trim() + '\n' +
           INDENT + '}\n' +
           '};\n';
  }

  // ---- 3. SASS Variables ----
  //   $colors-primary: #3b82f6;
  function convertToSass(flat) {
    var lines = [];
    var keys = Object.keys(flat).sort();
    for (var i = 0; i < keys.length; i++) {
      lines.push('$' + normalizeKey(keys[i]) + ': ' + flat[keys[i]] + ';');
    }
    return lines.join('\n') + '\n';
  }

  // ---- Main convert dispatcher ----
  function convert(jsonStr, format) {
    var parsed = parseInput(jsonStr);
    var flat = flatten(parsed, '');

    switch (format) {
      case 'css':      return convertToCss(flat);
      case 'tailwind': return convertToTailwind(flat);
      case 'sass':     return convertToSass(flat);
      default:         throw new Error('Unknown format: ' + format);
    }
  }

  // ---- Get currently selected format ----
  function getSelectedFormat() {
    for (var i = 0; i < formatRadios.length; i++) {
      if (formatRadios[i].checked) return formatRadios[i].value;
    }
    return 'css';
  }

  // ---- Show error ----
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
    inputArea.classList.add('has-error');
    outputArea.value = '';
  }

  // ---- Clear error ----
  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('visible');
    inputArea.classList.remove('has-error');
  }

  // ---- Run conversion and update output ----
  function runConversion() {
    var jsonStr = inputArea.value.trim();
    if (!jsonStr) {
      clearError();
      outputArea.value = '';
      return;
    }

    try {
      clearError();
      var format = getSelectedFormat();
      var result = convert(jsonStr, format);
      outputArea.value = result;
    } catch (err) {
      showError(formatJsonError(err, jsonStr));
    }
  }

  // ---- Debounced conversion (300ms) ----
  var debouncedConvert = debounce(runConversion, 300);

  // ---- Copy to clipboard ----
  function copyOutput() {
    var text = outputArea.value;
    if (!text) return;

    var setCopied = function() {
      copyFeedback.classList.add('visible');
      copyBtn.textContent = '✅ Copied!';
      copyBtn.classList.remove('btn-primary');
      copyBtn.classList.add('btn-success');

      setTimeout(function() {
        copyFeedback.classList.remove('visible');
        copyBtn.textContent = '📋 Copy';
        copyBtn.classList.remove('btn-success');
        copyBtn.classList.add('btn-primary');
      }, 2000);
    };

    // Primary: modern clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(setCopied).catch(function() {
        // fall through to fallback
        fallbackCopy(text, setCopied);
      });
    } else {
      fallbackCopy(text, setCopied);
    }
  }

  /** Legacy copy fallback using execCommand */
  function fallbackCopy(text, onSuccess) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      ta.style.opacity = '0';
      ta.readOnly = true;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { onSuccess(); }
    } catch (e) {
      // silently fail — clipboard unavailable
    }
  }

  // ---- Load sample tokens ----
  function loadSample() {
    inputArea.value = JSON.stringify(SAMPLE_TOKENS, null, 2);
    clearError();
    runConversion();
  }

  // ---- Theme toggle ----
  function toggleTheme() {
    var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    currentTheme = newTheme;
    themeIcon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
    try { localStorage.setItem('designtok-theme', newTheme); } catch (e) { /* noop */ }
  }

  // ---- Restore saved theme ----
  function restoreTheme() {
    try {
      var saved = localStorage.getItem('designtok-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
        currentTheme = saved;
        themeIcon.textContent = saved === 'dark' ? '🌙' : '☀️';
      }
    } catch (e) { /* noop */ }
  }

  // ---- Init ----
  function init() {
    restoreTheme();

    // Pre-fill with sample tokens
    loadSample();

    // Event listeners
    inputArea.addEventListener('input', debouncedConvert);

    for (var i = 0; i < formatRadios.length; i++) {
      formatRadios[i].addEventListener('change', runConversion);
    }

    sampleBtn.addEventListener('click', loadSample);
    copyBtn.addEventListener('click', copyOutput);
    themeToggle.addEventListener('click', toggleTheme);

    // Keyboard shortcut: Cmd/Ctrl+Shift+C → copy
    document.addEventListener('keydown', function(e) {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        copyOutput();
      }
    });
  }

  // Go
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
