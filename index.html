<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>designtok — Design Token Converter</title>
  <meta name="description" content="Convert design tokens to CSS custom properties, Tailwind CSS config, or SASS variables — all in your browser, zero dependencies.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   designtok — "The Workshop" aesthetic
   Warm, tactile, industrial-atelier. Brass, ink, and paper.
   ============================================================ */

/* --- Noise texture --- */
:root::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
}

/* ============================================================
   Custom Properties
   ============================================================ */
:root {
  --bg-deep: #120c08;
  --bg-surface: #1a140e;
  --bg-card: #1e1812;
  --bg-elevated: #241e17;
  --bg-input: #16100a;
  --border-subtle: #2c241d;
  --border-accent: #3d3026;
  --text-primary: #e8ddd0;
  --text-secondary: #a09080;
  --text-muted: #706050;
  --accent: #d96c3a;
  --accent-glow: rgba(217, 108, 58, 0.15);
  --accent-hover: #e8804e;
  --accent-amber: #b8845c;
  --amber-glow: rgba(184, 132, 92, 0.12);
  --error: #d65a5a;
  --error-bg: rgba(214, 90, 90, 0.1);
  --success: #8bb87c;
  --success-bg: rgba(139, 184, 124, 0.1);
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-card: 0 2px 12px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 0 1px var(--accent);
  --transition: 280ms cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="light"] {
  --bg-deep: #e8e0d4;
  --bg-surface: #f0eae0;
  --bg-card: #f8f2e8;
  --bg-elevated: #fcf6ec;
  --bg-input: #ede6da;
  --border-subtle: #d4cabc;
  --border-accent: #c4b8a8;
  --text-primary: #1a1410;
  --text-secondary: #5a4c3e;
  --text-muted: #9a8c7c;
  --accent: #b84e20;
  --accent-glow: rgba(184, 78, 32, 0.12);
  --accent-hover: #d45c28;
  --accent-amber: #8a6a4a;
  --amber-glow: rgba(138, 106, 74, 0.1);
  --error: #c43838;
  --error-bg: rgba(196, 56, 56, 0.08);
  --success: #5a8a4c;
  --success-bg: rgba(90, 138, 76, 0.08);
  --shadow-card: 0 2px 12px rgba(0,0,0,0.06);
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  font-weight: 400;
  background: var(--bg-deep);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   Layout
   ============================================================ */
.app-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 20px 56px;
  position: relative;
}

/* ============================================================
   Header
   ============================================================ */
.app-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 40px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border-subtle);
  animation: slideUp 600ms var(--ease-out) both;
}

.header-brand {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.app-title {
  font-family: var(--font-serif);
  font-size: 2.25rem;
  font-weight: 400;
  font-variation-settings: 'SOFT' 80, 'WONK' 0;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  line-height: 1.1;
}

.app-title span {
  color: var(--accent);
  font-style: italic;
  font-variation-settings: 'SOFT' 100, 'WONK' 1;
}

.tagline {
  font-family: var(--font-sans);
  font-size: 0.9rem;
  font-weight: 350;
  color: var(--text-secondary);
  letter-spacing: 0.01em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.theme-toggle {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  transition: background var(--transition), border-color var(--transition), transform var(--transition), color var(--transition);
  position: relative;
  overflow: hidden;
}

.theme-toggle::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent-glow);
  opacity: 0;
  transition: opacity var(--transition);
}

.theme-toggle:hover::after {
  opacity: 1;
}

.theme-toggle:hover {
  border-color: var(--border-accent);
  transform: translateY(-1px);
}

.theme-toggle:active {
  transform: scale(0.93);
}

/* ============================================================
   Cards
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-card);
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  position: relative;
  animation: slideUp 600ms var(--ease-out) both;
}

.card:nth-child(2) { animation-delay: 120ms; }
.card:nth-child(3) { animation-delay: 240ms; }

/* Decorative left border accent */
.card::before {
  content: '';
  position: absolute;
  left: -1px;
  top: 16px;
  bottom: 16px;
  width: 2px;
  background: linear-gradient(to bottom, var(--accent), var(--accent-amber));
  border-radius: 2px;
  opacity: 0.4;
  transition: opacity var(--transition);
}

.card:focus-within::before,
.card:hover::before {
  opacity: 0.8;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}

.card-title {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-amber);
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  font-size: 0.8125rem;
  font-weight: 500;
  font-family: var(--font-sans);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
  white-space: nowrap;
  user-select: none;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.06);
  opacity: 0;
  transition: opacity var(--transition);
}

.btn:hover::after {
  opacity: 1;
}

.btn-primary {
  background: var(--accent);
  color: #fcf6ec;
  border-color: var(--accent);
}

.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: scale(0.96);
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}

.btn-secondary:hover {
  color: var(--text-primary);
  border-color: var(--border-accent);
  transform: translateY(-1px);
}

.btn-secondary:active {
  transform: scale(0.96);
}

.btn-success {
  background: var(--success);
  color: #fcf6ec;
  border-color: var(--success);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 0.75rem;
}

/* ============================================================
   Textareas
   ============================================================ */
.textarea-wrapper {
  position: relative;
}

textarea {
  width: 100%;
  min-height: 200px;
  padding: 16px 18px;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  font-weight: 350;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  resize: vertical;
  outline: none;
  transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
  tab-size: 2;
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

textarea::placeholder {
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-weight: 400;
}

textarea[readonly] {
  cursor: default;
  background: var(--bg-surface);
}

textarea.has-error {
  border-color: var(--error);
  box-shadow: 0 0 0 2px var(--error-bg);
}

/* ============================================================
   Validation Error
   ============================================================ */
.error-message {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  font-size: 0.8125rem;
  color: var(--error);
  background: var(--error-bg);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(214, 90, 90, 0.2);
  word-break: break-word;
  font-family: var(--font-sans);
  animation: fadeSlide 200ms var(--ease-out) both;
}

.error-message.visible {
  display: block;
}

/* ============================================================
   Format Selector — Workshop Tags
   ============================================================ */
.format-selector {
  display: flex;
  gap: 2px;
  background: var(--bg-elevated);
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}

.format-option {
  position: relative;
}

.format-option input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.format-option label {
  display: block;
  padding: 7px 18px;
  font-family: var(--font-sans);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: transparent;
  border-radius: 2px;
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
  position: relative;
}

.format-option input:checked + label {
  color: var(--accent);
  background: var(--bg-card);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.format-option label:hover {
  color: var(--text-secondary);
}

.format-option input:focus-visible + label {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ============================================================
   Copy Container
   ============================================================ */
.copy-container {
  display: flex;
  align-items: center;
  gap: 10px;
}

.copy-feedback {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--success);
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
  order: -1;
}

.copy-feedback.visible {
  opacity: 1;
}

/* ============================================================
   Toolbar
   ============================================================ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ============================================================
   Footer
   ============================================================ */
.app-footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid var(--border-subtle);
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  animation: fadeIn 600ms var(--ease-out) 400ms both;
}

.app-footer a {
  color: var(--accent-amber);
  text-decoration: none;
  transition: color var(--transition);
}

.app-footer a:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeSlide {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================================
   Theme toggle icon swap
   ============================================================ */
[data-theme="dark"] .theme-toggle .light-icon { display: none; }
[data-theme="dark"] .theme-toggle .dark-icon { display: inline; }
[data-theme="light"] .theme-toggle .light-icon { display: inline; }
[data-theme="light"] .theme-toggle .dark-icon { display: none; }

/* ============================================================
   Scrollbar
   ============================================================ */
textarea::-webkit-scrollbar { width: 6px; }
textarea::-webkit-scrollbar-track { background: transparent; }
textarea::-webkit-scrollbar-thumb {
  background: var(--border-subtle);
  border-radius: 3px;
}
textarea::-webkit-scrollbar-thumb:hover {
  background: var(--border-accent);
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 600px) {
  .app-container {
    padding: 20px 14px 36px;
  }

  .app-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 18px;
  }

  .header-actions {
    align-self: flex-end;
    margin-top: -44px;
  }

  .app-title {
    font-size: 1.7rem;
  }

  .card {
    padding: 16px;
  }

  .card-header {
    flex-direction: column;
    align-items: flex-start;
  }

  textarea {
    min-height: 140px;
    font-size: 0.75rem;
    padding: 12px 14px;
  }

  .format-selector {
    width: 100%;
  }

  .format-option {
    flex: 1;
  }

  .format-option label {
    text-align: center;
    padding: 6px 8px;
    font-size: 0.7rem;
  }

  .copy-container {
    width: 100%;
    flex-wrap: wrap;
  }

  .copy-container .format-selector {
    flex: 1;
    min-width: 0;
  }

  .copy-container .btn {
    flex-shrink: 0;
  }
}

@media (min-width: 601px) and (max-width: 1024px) {
  .app-container {
    padding: 28px 24px 48px;
  }
}

@media (min-width: 1025px) {
  .app-container {
    padding: 40px 32px 72px;
  }

  textarea {
    min-height: 240px;
  }
}

/* Selection */
::selection {
  background: var(--accent-glow);
  color: var(--text-primary);
}

/* Focus visible */
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- ====== Header ====== -->
  <header class="app-header">
    <div class="header-brand">
      <h1 class="app-title">design<span>tok</span></h1>
      <p class="tagline">Convert design tokens to CSS, Tailwind, or SASS</p>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <span class="dark-icon">☽</span>
        <span class="light-icon">⊙</span>
      </button>
    </div>
  </header>

  <!-- ====== Input Section ====== -->
  <section class="card" id="inputCard">
    <div class="card-header">
      <span class="card-title">Input — JSON Design Tokens</span>
      <div class="toolbar">
        <button class="btn btn-secondary btn-sm" id="sampleBtn" title="Load sample tokens">↺ Sample</button>
      </div>
    </div>
    <div class="textarea-wrapper">
      <textarea id="inputArea"
        placeholder='{&#10;  "colors": {&#10;    "primary": "#3b82f6",&#10;    "secondary": "#8b5cf6"&#10;  },&#10;  "spacing": {&#10;    "md": "1rem"&#10;  }&#10;}'
        spellcheck="false"
      ></textarea>
    </div>
    <div class="error-message" id="errorMsg"></div>
  </section>

  <!-- ====== Output Section ====== -->
  <section class="card" id="outputCard">
    <div class="card-header">
      <span class="card-title">Output</span>
      <div class="copy-container">
        <span class="copy-feedback" id="copyFeedback">Copied</span>
        <div class="format-selector" role="radiogroup" aria-label="Output format">
          <div class="format-option">
            <input type="radio" name="format" id="fmtCss" value="css" checked>
            <label for="fmtCss">CSS</label>
          </div>
          <div class="format-option">
            <input type="radio" name="format" id="fmtTailwind" value="tailwind">
            <label for="fmtTailwind">Tailwind</label>
          </div>
          <div class="format-option">
            <input type="radio" name="format" id="fmtSass" value="sass">
            <label for="fmtSass">SASS</label>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="copyBtn" title="Copy to clipboard">⤢ Copy</button>
      </div>
    </div>
    <div class="textarea-wrapper">
      <textarea id="outputArea" readonly placeholder="Output will appear here…" spellcheck="false"></textarea>
    </div>
  </section>

  <!-- ====== Footer ====== -->
  <footer class="app-footer">
    <p>designtok &mdash; <a href="https://github.com/kvnlnk/designtok" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </footer>
</div>

<script>

   designtok — Vanilla JS App
   Zero dependencies, works offline.

  'use strict';

  // ---- DOM refs ----

  const copyFeedback = document.getElementById('copyFeedback');
  const themeToggle  = document.getElementById('themeToggle');
  const formatRadios = document.querySelectorAll('input[name="format"]');

  // ---- Sample design tokens ----
  const SAMPLE_TOKENS = {
    "colors": {
      "primary": "#3b82f6",

      "fontWeight": {

      "lineHeight": {

      }

    "shadows": {

      "lg": "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1)",
      "xl": "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)"

  // ---- Theme state ----
  let currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';

  // ---- Helpers ----

  function debounce(fn, ms) {
    let timer;
    return function() {
      const ctx = this, args = arguments;
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(ctx, args), ms);
    };
  }

  function flatten(obj, prefix) {
    const result = {};
    for (const key in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, key)) continue;
      const prefixed = prefix ? prefix + '.' + key : key;
      const val = obj[key];
      if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
        const sub = flatten(val, prefixed);
        for (const sk in sub) {
          if (Object.prototype.hasOwnProperty.call(sub, sk)) result[sk] = sub[sk];
        }
      } else {
        result[prefixed] = String(val);
      }
    }
    return result;
  }

  function unflatten(flat) {
    const root = {};
    for (const key in flat) {
      if (!Object.prototype.hasOwnProperty.call(flat, key)) continue;
      const value = flat[key];
      const parts = key.split('.');
      let current = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        if (!current[part] || typeof current[part] !== 'object') current[part] = {};
        current = current[part];
      }
      current[parts[parts.length - 1]] = value;
    }
    return root;
  }

  function normalizeKey(key) {
    return key.replace(/\./g, '-').toLowerCase();
  }

  function parseInput(jsonStr) {
    const parsed = JSON.parse(jsonStr);
    if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
      throw new Error('Input must be a JSON object (key-value pairs).');
    }
    return parsed;
  }

  function formatJsonError(err, jsonStr) {
    let msg = err.message || 'Invalid JSON';
    if (err instanceof SyntaxError) {
      const m = msg.match(/position\s+(\d+)/i);
      if (m) {
        const pos = parseInt(m[1], 10);
        const line = (jsonStr.slice(0, pos).match(/\n/g) || []).length + 1;
        return 'JSON parse error at line ' + line + ': ' + msg;
      }
    }
    return 'Error: ' + msg;
  }

  // ================================================================
  // CONVERTERS
  // ================================================================

  function convertToCss(flat) {
    const lines = [':root {'];
    const keys = Object.keys(flat).sort();
    for (const key of keys) {
      lines.push('  --' + normalizeKey(key) + ': ' + flat[key] + ';');
    }
    lines.push('}');
    return lines.join('\n') + '\n';
  }

  function convertToTailwind(flat) {
    const nested = unflatten(flat);
    const INDENT = '  ';

    function renderValue(val, depth) {
      if (val === null) return 'null';
      if (typeof val === 'boolean') return val ? 'true' : 'false';
      if (typeof val === 'number') return String(val);
      if (typeof val === 'string') return "'" + val.replace(/'/g, "\\'") + "'";

      const keys = Object.keys(val);
      if (keys.length === 0) return '{}';

      const innerPad = INDENT.repeat(depth + 1);
      const parts = ['{'];
      for (const k of keys) {
        const v = val[k];
        const fk = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(k) ? k : "'" + k.replace(/'/g, "\\'") + "'";
        parts.push(innerPad + fk + ': ' + renderValue(v, depth + 1) + ',');
      }
      parts.push(INDENT.repeat(depth) + '}');
      return parts.join('\n');
    }

    const body = renderValue(nested, 1);
    const indentedBody = body.split('\n').map(l => INDENT + l).join('\n');
    return 'module.exports = {\n' +
           INDENT + 'theme: {\n' +
           INDENT + INDENT + 'extend: ' + indentedBody.trim() + '\n' +
           INDENT + '}\n' +
           '};\n';
  }

  function convertToSass(flat) {
    const lines = [];
    const keys = Object.keys(flat).sort();
    for (const key of keys) {
      lines.push('$' + normalizeKey(key) + ': ' + flat[key] + ';');
    }
    return lines.join('\n') + '\n';
  }

  function convert(jsonStr, format) {
    const parsed = parseInput(jsonStr);
    const flat = flatten(parsed, '');
    switch (format) {
      case 'css':      return convertToCss(flat);
      case 'tailwind': return convertToTailwind(flat);
      case 'sass':     return convertToSass(flat);
      default:         throw new Error('Unknown format: ' + format);
    }
  }

  function getSelectedFormat() {
    for (const radio of formatRadios) {
      if (radio.checked) return radio.value;
    }
    return 'css';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
    inputArea.classList.add('has-error');
    outputArea.value = '';
  }

  function clearError() {
    errorMsg.textContent = '';
    errorMsg.classList.remove('visible');
    inputArea.classList.remove('has-error');
  }

  function runConversion() {
    const jsonStr = inputArea.value.trim();
    if (!jsonStr) {
      clearError();
      outputArea.value = '';
      return;
    }
    try {
      clearError();
      const format = getSelectedFormat();
      outputArea.value = convert(jsonStr, format);
    } catch (err) {
      showError(formatJsonError(err, jsonStr));
    }
  }

  const debouncedConvert = debounce(runConversion, 300);

  function copyOutput() {
    const text = outputArea.value;
    if (!text) return;

    const setCopied = () => {
      copyFeedback.classList.add('visible');
      copyBtn.textContent = '✓ Copied';
      copyBtn.classList.remove('btn-primary');
      copyBtn.classList.add('btn-success');
      setTimeout(() => {
        copyFeedback.classList.remove('visible');
        copyBtn.textContent = '⤢ Copy';
        copyBtn.classList.remove('btn-success');
        copyBtn.classList.add('btn-primary');
      }, 2000);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(setCopied).catch(() => fallbackCopy(text, setCopied));
    } else {
      fallbackCopy(text, setCopied);
    }
  }

  function fallbackCopy(text, onSuccess) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      ta.style.opacity = '0';
      ta.readOnly = true;
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) onSuccess();
    } catch (_) {}
  }

  function loadSample() {
    inputArea.value = JSON.stringify(SAMPLE_TOKENS, null, 2);
    inputArea.style.height = 'auto';
    inputArea.style.height = Math.min(inputArea.scrollHeight, 480) + 'px';
    clearError();
    runConversion();
  }

  function toggleTheme() {
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    currentTheme = newTheme;
    try { localStorage.setItem('designtok-theme', newTheme); } catch (_) {}
  }

  function restoreTheme() {
    try {
      const saved = localStorage.getItem('designtok-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
        currentTheme = saved;
      }
    } catch (_) {}
  }

  function init() {
    restoreTheme();
    loadSample();

    inputArea.addEventListener('input', debouncedConvert);
    for (const radio of formatRadios) {
      radio.addEventListener('change', runConversion);
    }
    sampleBtn.addEventListener('click', loadSample);
    copyBtn.addEventListener('click', copyOutput);
    themeToggle.addEventListener('click', toggleTheme);

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'C') {
        e.preventDefault();
        copyOutput();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
